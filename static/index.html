<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Phone Stream</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2027; --line: #2c3540;
    --fg: #e8edf2; --dim: #9aa7b2; --acc: #4da3ff; --ok: #3ecf6f; --warn: #ffb44d; --err: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    overscroll-behavior: none;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; gap: 8px; margin-left: auto; }
  .controls button { flex: 0 0 auto; white-space: nowrap; }
  /* HTML zone: renders server responses that are HTML */
  #html-zone {
    flex: 0 0 auto; max-height: 45%; overflow-y: auto;
    padding: 12px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: none;
  }
  #html-zone.show { display: block; }
  #html-zone .zone-label { font-size: 10px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; }
  #html-zone .zone-label button { margin-left: auto; }
  #html-content { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-x: auto; }
  #html-content :where(img, video, svg, table, pre) { max-width: 100%; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); flex: 0 0 auto; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .status { font-size: 12px; color: var(--dim); flex: 0 0 auto; max-width: 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #log {
    flex: 1 1 auto; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 12px; white-space: pre-wrap;
    word-break: break-word; user-select: text; -webkit-user-select: text;
    animation: pop .15s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .msg .row { display: flex; align-items: center; gap: 8px; }
  .msg .tag { font-size: 10px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  .msg .actions { flex: 1; text-align: right; opacity: 0; transition: opacity .15s; }
  .msg:hover .actions, .msg:focus-within .actions { opacity: 1; }
  .msg audio { width: 100%; margin-top: 6px; }
  button {
    background: var(--acc); color: #fff; border: 0; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  button:active { transform: scale(.96); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
  button.off { background: #555; }
  footer {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line);
    position: relative;
  }

  .composer { display: flex; gap: 8px; }
  /* 3-level command menu (theme > sub-theme > command) */
  #menu-btn {
    flex: 0 0 auto; min-width: 44px; padding: 10px 8px;
    font-size: 14px; border-radius: 10px; background: var(--panel);
    border: 1px solid var(--line); color: var(--fg);
  }
  #menu-panel {
    position: absolute; bottom: 100%; left: 0; margin-bottom: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    min-width: 220px; max-width: 92vw; max-height: 60vh; overflow-y: auto;
    padding: 6px; display: none; z-index: 30;
  }
  #menu-panel.open { display: block; }
  .menu-item {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 8px;
    color: var(--fg); font: inherit; font-size: 14px;
    padding: 9px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .menu-item:hover, .menu-item:active { background: var(--bg); }
  .menu-item.theme { color: var(--acc); font-weight: 600; }
  .menu-item.back { color: var(--dim); font-size: 12px; }
  .menu-item.command { color: var(--fg); }
  .menu-title {
    font-size: 10px; letter-spacing: .08em; color: var(--dim);
    text-transform: uppercase; padding: 6px 12px 2px; user-select: none;
  }
  .menu-sep { border-top: 1px solid var(--line); margin: 4px 6px; }
  #text-input {
    flex: 1; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font: inherit; resize: none; min-height: 42px; max-height: 120px;
  }
  #send-btn { flex: 0 0 auto; padding: 10px 16px; font-size: 14px; border-radius: 10px; }
  #banner {
    display: none; padding: 8px 12px; font-size: 13px;
    background: #3a2e14; color: var(--warn); border-bottom: 1px solid #6a541f;
  }
  #banner.show { display: block; }
</style>
</head>
<body>
<header>
  <div class="dot" id="status-dot"></div>
  <h1>Phone Stream</h1>
  <div class="status" id="status-text">disconnected</div>
  <div class="controls">
    <button id="mic-btn" class="off">&#127908; Mic live</button>
    <button id="speaker-btn" class="off">&#128266; Speaker off</button>
  </div>
</header>
<div id="banner">Sending paused &mdash; phone locked. Received text is kept.</div>
<main>
  <section id="html-zone" aria-label="HTML content from the server">
    <div class="zone-label"><span>HTML</span><button id="html-close" class="ghost" title="Close">&#10005;</button></div>
    <div id="html-content"></div>
  </section>
  <section id="log" aria-label="Received messages"></section>
  <footer>
    <div class="composer">
      <button id="menu-btn" title="Commands">---</button>
      <div id="menu-panel"></div>
      <textarea id="text-input" rows="1" placeholder="Type a message to the server&hellip;"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </footer>
</main>
<script>
"use strict";
(() => {
  // ---- configuration -------------------------------------------------
  // Access token: taken from the ?token= parameter of the page URL
  // (the server refuses any request without it). Page and WebSocket must
  // both be loaded over TLS (https/wss) - the server has no plaintext port.
  const TOKEN = new URLSearchParams(location.search).get("token") || "";
  // Persistent client id: survives reconnections and page reloads
  // (localStorage), so the server can keep this client's history across
  // WebSocket reconnects. Cleared only if the browser forgets it.
  const CLIENT_ID_KEY = "phone-stream-client-id";
  let clientId = null;
  try { clientId = localStorage.getItem(CLIENT_ID_KEY); } catch (e) {}
  if (!clientId) {
    clientId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(36).slice(2);
    try { localStorage.setItem(CLIENT_ID_KEY, clientId); } catch (e) {}
  }
  const WS_URL = (location.protocol === "https:" ? "wss://" : "wss://")
    + location.host + "/phone?token=" + encodeURIComponent(TOKEN)
    + "&client_id=" + encodeURIComponent(clientId);

  // ---- elements -------------------------------------------------------
  const dot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const banner = document.getElementById("banner");
  const logEl = document.getElementById("log");
  const micBtn = document.getElementById("mic-btn");
  const speakerBtn = document.getElementById("speaker-btn");
  const htmlZone = document.getElementById("html-zone");
  const htmlContent = document.getElementById("html-content");
  const htmlClose = document.getElementById("html-close");

  // Heuristic: a response is treated as HTML when it starts with a tag
  // or the server tagged it "html".
  function looksLikeHtml(text, tag) {
    if (tag === "html") return true;
    const t = text.trim();
    return t.startsWith("<") && /<\/[a-zA-Z][^>]*>/.test(t);
  }

  function showHtml(text) {
    htmlContent.innerHTML = text;
    htmlZone.classList.add("show");
    htmlZone.scrollTop = 0;
  }

  htmlClose.addEventListener("click", () => htmlZone.classList.remove("show"));

  // ---- 3-level command menu (theme > sub-theme > command) ----------
  // Themes mirror the classification domains (detection_classification.py).
  // Edit COMMANDS to add/modify entries; a command is sent to the server
  // as if typed in the composer.
  const COMMANDS = {
    "Pastoral": {
      "Prières": ["Notre Père", "Bénédiction", "Confession"],
      "Lectures": ["Psaume 23", "Ésaü et Jacob", "Sermon sur la montagne"],
      "Actions": ["Récite le verset du jour", "Méditation guidée"],
    },
    "Théologique": {
      "Concepts": ["Explique la trinité", "Différence justification/sanctification"],
      "Histoire": ["Concile de Nicée", "Réforme protestante"],
    },
    "Informatique": {
      "Système": ["État du serveur", "Redémarre le service", "Logs récents"],
      "Réseau": ["Test de connexion", "Adresse IP locale"],
    },
  };

  const menuBtn = document.getElementById("menu-btn");
  const menuPanel = document.getElementById("menu-panel");
  let menuPath = []; // e.g. ["Pastoral", "Prières"]

  function closeMenu() {
    menuPanel.classList.remove("open");
    menuPath = [];
  }

  function sendCommand(text) {
    textInput.value = text;
    closeMenu();
    sendText();
  }

  function renderMenu() {
    menuPanel.textContent = "";
    const mk = (cls, label, fn) => {
      const b = document.createElement("button");
      b.className = "menu-item " + cls;
      b.textContent = label;
      b.addEventListener("click", fn);
      menuPanel.appendChild(b);
      return b;
    };
    const title = (t) => {
      const d = document.createElement("div");
      d.className = "menu-title";
      d.textContent = t;
      menuPanel.appendChild(d);
    };
    const sep = () => {
      const d = document.createElement("div");
      d.className = "menu-sep";
      menuPanel.appendChild(d);
    };

    if (menuPath.length === 0) {
      title("Thèmes");
      for (const theme of Object.keys(COMMANDS)) {
        mk("theme", theme, () => { menuPath = [theme]; renderMenu(); });
      }
    } else if (menuPath.length === 1) {
      const theme = menuPath[0];
      mk("back", "←", () => { menuPath = []; renderMenu(); });
      title(theme);
      for (const sub of Object.keys(COMMANDS[theme])) {
        mk("theme", sub, () => { menuPath = [theme, sub]; renderMenu(); });
      }
    } else {
      const [theme, sub] = menuPath;
      mk("back", "← " + theme, () => { menuPath = [theme]; renderMenu(); });
      title(theme + " › " + sub);
      sep();
      for (const cmd of COMMANDS[theme][sub]) {
        mk("command", cmd, () => sendCommand(cmd));
      }
    }
  }

  menuBtn.addEventListener("click", () => {
    if (menuPanel.classList.contains("open")) {
      closeMenu();
    } else {
      menuPath = [];
      renderMenu();
      menuPanel.classList.add("open");
    }
  });
  // close when tapping outside, or on Escape
  document.addEventListener("click", (e) => {
    if (menuPanel.classList.contains("open") &&
        !menuPanel.contains(e.target) && e.target !== menuBtn) {
      closeMenu();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
  });
  const textInput = document.getElementById("text-input");
  const sendBtn = document.getElementById("send-btn");

  // ---- state ----------------------------------------------------------
  let ws = null;
  let session = 0;                  // increments on each (re)connect
  let micActive = false;            // user intent
  let speakerOn = false;            // user intent
  let locked = false;               // phone lock / page hidden
  let sendingPaused = false;        // locked && (micActive || speakerOn)
  let micProcessor = null;         // ScriptProcessorNode for PCM capture
  let stream = null;                // getUserMedia stream
  let outQueue = [];                // binary blocks awaiting ws drain
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const pending = new Map();        // session -> [binary blocks], audio before play()
  let pendingSession = null;

  const pcm = {
    sampleRate: 16000,              // agreed with server
    channels: 1,
    format: "S16",
  };

  // ---- status UI ------------------------------------------------------
  function setStatus(ok, text, cls) {
    dot.className = "dot" + (cls ? " " + cls : "");
    statusText.textContent = text;
  }

  // ---- lock / visibility detection -------------------------------------
  function updateLockState() {
    locked = document.hidden;
    applySendingState();
  }
  document.addEventListener("visibilitychange", updateLockState);
  window.addEventListener("pagehide", updateLockState);

  function applySendingState() {
    sendingPaused = locked && (micActive || speakerOn);
    banner.classList.toggle("show", locked && (micActive || speakerOn));
    if (locked) {
      // stop all outbound streaming; received text is kept (DOM persists)
      if (micProcessor) { try { micProcessor.disconnect(); } catch (e) {} micProcessor = null; }
    } else if (micActive) {
      startMic(); // resume
    }
  }

  // ---- websocket -------------------------------------------------------
  function connect() {
    const mySession = ++session;
    setStatus(false, "connecting…");
    ws = new WebSocket(WS_URL);
    ws.binaryType = "arraybuffer";
    pending.set(mySession, []);
    ws.onopen = () => {
      pendingSession = mySession;
      setStatus(true, "connected", "ok");
      if (micActive && !locked) startMic();
      // replay any blocks queued while disconnected? (kept minimal: dropped)
      outQueue = [];
    };
    ws.onclose = () => {
      if (mySession !== session) return; // stale
      setStatus(false, "disconnected");
      stopMic();
      setTimeout(connect, 2000); // auto-reconnect, keeps app running "all time"
    };
    ws.onerror = () => setStatus(false, "error", "warn");
    ws.onmessage = (ev) => {
      if (mySession !== session) return;
      if (ev.data instanceof ArrayBuffer) {
        receiveAudioBlock(new Uint8Array(ev.data));
      } else {
        receiveTextFrame(ev.data);
      }
    };
  }

  // ---- audio out (headset) ---------------------------------------------
  function receiveAudioBlock(u8) {
    if (!speakerOn) return;
    const mySession = session;
    // Play via AudioContext: convert S16 PCM to float at the right rate.
    const view = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const frames = Math.floor(u8.byteLength / 2);
    const buf = audioCtx.createBuffer(1, Math.max(frames, 1), pcm.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = view.getInt16(i * 2, true) / 32768;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    if (audioCtx.state === "suspended") {
      pending.get(mySession).push(src);
      if (!pendingSession) pendingSession = mySession;
    } else {
      src.start();
    }
  }

  // Speaker must be started by a user gesture (autoplay policy).
  speakerBtn.addEventListener("click", async () => {
    speakerOn = !speakerOn;
    speakerBtn.classList.toggle("off", !speakerOn);
    speakerBtn.innerHTML = speakerOn ? "&#128266; Speaker on" : "&#128266; Speaker off";
    if (speakerOn) {
      if (audioCtx.state === "suspended") {
        try { await audioCtx.resume(); flushPending(session); } catch (e) {}
      }
    }
  });

  function flushPending(s) {
    const q = pending.get(s);
    if (!q) return;
    pending.set(s, []);
    for (const src of q) { try { src.start(); } catch (e) {} }
  }

  // ---- audio in (microphone) --------------------------------------------
  // The server's realtime transcription API expects raw 16-bit PCM mono at
  // 16 kHz. MediaRecorder only produces compressed containers (webm/opus),
  // so we capture with a ScriptProcessorNode, downmix to mono, resample to
  // pcm.sampleRate and send raw PCM blocks every ~250 ms.
  async function startMic() {
    if (micProcessor) return;
    if (!stream) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setStatus(true, "mic denied", "warn");
        return;
      }
    }

    const source = audioCtx.createMediaStreamSource(stream);
    const blockSamples = Math.floor(pcm.sampleRate * 250 / 1000); // 250 ms
    micProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

    let acc = new Float32Array(0);
    micProcessor.onaudioprocess = (ev) => {
      const input = ev.inputBuffer.getChannelData(0); // mono capture
      const ratio = audioCtx.sampleRate / pcm.sampleRate;
      const nOut = Math.max(1, Math.floor(input.length / ratio));
      const res = new Float32Array(nOut);
      for (let i = 0; i < nOut; i++) {
        const pos = i * ratio;
        const i0 = Math.floor(pos);
        const frac = pos - i0;
        const i1 = Math.min(i0 + 1, input.length - 1);
        res[i] = input[i0] * (1 - frac) + input[i1] * frac;
      }
      const merged = new Float32Array(acc.length + res.length);
      merged.set(acc); merged.set(res, acc.length);
      acc = merged;

      while (acc.length >= blockSamples) {
        const block = acc.subarray(0, blockSamples);
        const buf = new DataView(new ArrayBuffer(blockSamples * 2));
        for (let i = 0; i < blockSamples; i++) {
          const s = Math.max(-1, Math.min(1, block[i]));
          buf.setInt16(i * 2, s < 0 ? s * 32768 : s * 32767, true);
        }
        if (ws && ws.readyState === 1 && !locked) ws.send(buf.buffer);
        acc = acc.subarray(blockSamples);
      }
    };
    source.connect(micProcessor);
    micProcessor.connect(audioCtx.destination); // needed to drive the node
  }

  function stopMic() {
    if (micProcessor) {
      try { micProcessor.disconnect(); } catch (e) {}
      micProcessor = null;
    }
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
  }

  micBtn.addEventListener("click", () => {
    micActive = !micActive;
    micBtn.classList.toggle("off", !micActive);
    micBtn.innerHTML = micActive ? "&#127908; Mic live" : "&#127908; Mic off";
    if (micActive && !locked) startMic();
    if (!micActive) stopMic();
  });

  // ---- text ------------------------------------------------------------
  function addMessage(tag, text, opts) {
    const div = document.createElement("div");
    div.className = "msg";
    div.tabIndex = 0;
    const row = document.createElement("div");
    row.className = "row";
    const t = document.createElement("span");
    t.className = "tag";
    t.textContent = tag;
    const actions = document.createElement("span");
    actions.className = "actions";
    const btn = document.createElement("button");
    btn.textContent = "Copy";
    btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); }
      catch (e) { fallbackCopy(text); }
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = "Copy"), 1500);
    });
    actions.appendChild(btn);
    row.append(t, actions);
    const body = document.createElement("div");
    body.textContent = text;
    div.append(row, body);
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }

  function receiveTextFrame(raw) {
    let tag = "server";
    let text = raw;
    try {
      const msg = JSON.parse(raw);
      if (typeof msg === "object" && msg !== null && typeof msg.text === "string") {
        text = msg.text;
        if (typeof msg.tag === "string") tag = msg.tag;
      }
    } catch (e) { /* plain text */ }
    if (looksLikeHtml(text, tag)) {
      showHtml(text);
      return;
    }
    addMessage(tag, text);
  }

  async function sendText() {
    const text = textInput.value.trim();
    if (!text) return;
    if (ws && ws.readyState === 1 && !locked) {
      ws.send(JSON.stringify({ type: "text", text: text }));
      textInput.value = "";
    } else if (locked) {
      banner.textContent = "Cannot send while phone is locked.";
      setTimeout(() => (banner.textContent = "Sending paused \u2014 phone locked. Received text is kept."), 2000);
    }
  }
  sendBtn.addEventListener("click", sendText);
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); }
  });

  // ---- start ------------------------------------------------------------
  connect();
  updateLockState();
})();
</script>
</body>
</html>
